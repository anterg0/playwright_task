<VirtualHost *:80>
    ServerName localhost

    WSGIDaemonProcess video_service python-home=/usr/local python-path=/app
    WSGIProcessGroup video_service
    WSGIApplicationGroup %{GLOBAL}

    WSGIScriptAlias / /app/app.wsgi

    <Directory /app>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>